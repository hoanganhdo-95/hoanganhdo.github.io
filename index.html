<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Âm Dương & Số Tuần</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calendar-card">
        <h2>Hôm nay</h2>
        <div class="date-item">
            <span class="label">📅 Dương lịch:</span>
            <span id="solar-date" class="value">Đang tải...</span>
        </div>
        <div class="date-item">
            <span class="label">🌙 Âm lịch:</span>
            <span id="lunar-date" class="value">Đang tải...</span>
        </div>
        <div class="date-item">
            <span class="label">🔢 Tuần thứ:</span>
            <span id="week-number" class="value highlight">Đang tải...</span>
        </div>
    </div>

    <!-- Tải thư viện tính âm lịch của tác giả Hồ Ngọc Đức -->
    <script src="https://ngocduc.org"></script>
    <script src="script.js"></script>
</body>
</html>
